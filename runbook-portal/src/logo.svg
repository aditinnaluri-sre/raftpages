<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Logo Mark Primary Gradient -->
    <linearGradient id="runflow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D6FE8"/>
      <stop offset="50%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#3ECF8E"/>
    </linearGradient>

    <!-- Subtle Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box (Optional Preview Background) -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg-grad)" />

  <!-- Logo Mark: Terminal Chevron '>' merging into Play Arrow '▶' & Wave -->
  <g transform="translate(32, 24)">
    <!-- Outer Glow Shape -->
    <path d="M 12 12 L 42 36 L 12 60 L 22 36 Z" fill="url(#runflow-grad)" opacity="0.3" filter="url(#glow)"/>

    <!-- Main Terminal Chevron '>' -->
    <path d="M 10 10 L 40 36 L 10 62 L 20 36 Z" fill="url(#runflow-grad)"/>

    <!-- Secondary Fluid Flow Wave '▶' -->
    <path d="M 28 10 L 58 36 L 28 62 L 38 36 Z" fill="url(#runflow-grad)" opacity="0.85"/>

    <!-- Horizontal Flow Accent Line -->
    <path d="M 46 56 L 68 56" stroke="#3ECF8E" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Typography: RunFlow.io -->
  <g transform="translate(124, 70)">
    <!-- "Run" Text -->
    <text font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="42" fill="#FFFFFF" letter-spacing="-0.5">Run</text>
    
    <!-- "Flow" Text with Gradient -->
    <text x="82" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="42" fill="url(#runflow-grad)" letter-spacing="-0.5">Flow</text>

    <!-- ".io" Badge -->
    <g transform="translate(200, -32)">
      <rect x="0" y="0" width="48" height="24" rx="8" fill="#3D6FE8" fill-opacity="0.2" stroke="#3D6FE8" stroke-width="1.5"/>
      <text x="24" y="16" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="13" fill="#5B8CFF" text-anchor="middle">.io</text>
    </g>
  </g>
</svg>
